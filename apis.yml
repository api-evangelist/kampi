name: Kampi
description: Kampi is an aquaculture technology company headquartered in Samborondón, Ecuador, building
  an AI-powered mobile app and platform for real-time shrimp farm management. Created by the team behind
  XpertSea (KAMPI AQUA SOLUTIONS S.A. / XpertSea Solution Inc.), Kampi converts daily farm records into
  personalized guidance using machine learning, an approach it calls dynamic precision farming. The
  platform combines three integrated tools — Pond Vision (intelligent pond monitoring), FarmAI (predictive
  biomass analytics) and Farmbook (digital team integration) — to deliver biomass monitoring, biological
  parameter tracking, real-time alerts, harvest planning and FCR optimization from a smartphone, online or
  offline. Kampi is a marketing-and-mobile-app company with no public developer API, OpenAPI, or developer
  portal at this time; this profile captures its published web presence and a verbatim llms.txt it serves.
